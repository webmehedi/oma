<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Ledgerly</title>
<link rel="stylesheet" href="tokens.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lenis@1.3.26/dist/lenis.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/motion@12/dist/motion.js" defer></script>
<script src="motion.js" defer></script>
</head>
<body data-screen-state="empty">

<main style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--space-6) var(--space-4);">
  <p class="t-heading" style="margin-bottom: var(--space-6);"><span class="brand"><span class="brand-mark">●</span> Ledgerly</span></p>

  <!-- EMPTY: pristine sign-in form (signed-out landing) -->
  <section data-state-panel="empty" class="card card-pad" style="width: 100%; max-width: 400px;" aria-label="Sign in">
    <div class="filter-tabs" role="tablist" aria-label="Sign in or create account" style="display: flex; margin-bottom: var(--space-6);">
      <button class="filter-tab" role="tab" aria-selected="true" style="flex:1">Sign in</button>
      <button class="filter-tab" role="tab" aria-selected="false" style="flex:1">Create account</button>
    </div>
    <form style="display: flex; flex-direction: column; gap: var(--space-4);">
      <div class="field">
        <label class="field-label" for="email-empty">Email</label>
        <input class="input" id="email-empty" name="email" type="email" autocomplete="email" autofocus>
      </div>
      <div class="field">
        <label class="field-label" for="pw-empty">Password</label>
        <input class="input" id="pw-empty" name="password" type="password" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" type="button" style="width: 100%;">Sign in</button>
    </form>
  </section>

  <!-- IDEAL: filled, ready to submit -->
  <section data-state-panel="ideal" hidden class="card card-pad" style="width: 100%; max-width: 400px;" aria-label="Sign in, filled">
    <div class="filter-tabs" role="tablist" aria-label="Sign in or create account" style="display: flex; margin-bottom: var(--space-6);">
      <button class="filter-tab" role="tab" aria-selected="true" style="flex:1">Sign in</button>
      <button class="filter-tab" role="tab" aria-selected="false" style="flex:1">Create account</button>
    </div>
    <form style="display: flex; flex-direction: column; gap: var(--space-4);">
      <div class="field">
        <label class="field-label" for="email-ideal">Email</label>
        <input class="input" id="email-ideal" name="email" type="email" value="maya@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label class="field-label" for="pw-ideal">Password</label>
        <input class="input" id="pw-ideal" name="password" type="password" value="correct-horse-battery" autocomplete="current-password">
      </div>
      <a class="btn btn-primary" href="dashboard.html" style="width: 100%;">Sign in</a>
      <p class="field-hint" style="text-align:center;">On success you land on the dashboard.</p>
    </form>
  </section>

  <!-- LOADING: submitting -->
  <section data-state-panel="loading" hidden class="card card-pad" style="width: 100%; max-width: 400px;" aria-label="Signing in" aria-busy="true">
    <div class="filter-tabs" style="display: flex; margin-bottom: var(--space-6);">
      <button class="filter-tab" aria-selected="true" style="flex:1" disabled>Sign in</button>
      <button class="filter-tab" aria-selected="false" style="flex:1" disabled>Create account</button>
    </div>
    <form style="display: flex; flex-direction: column; gap: var(--space-4);">
      <div class="field">
        <label class="field-label" for="email-loading">Email</label>
        <input class="input" id="email-loading" type="email" value="maya@example.com" disabled>
      </div>
      <div class="field">
        <label class="field-label" for="pw-loading">Password</label>
        <input class="input" id="pw-loading" type="password" value="correct-horse-battery" disabled>
      </div>
      <button class="btn btn-primary" type="button" disabled style="width: 100%;">
        <span class="spinner" aria-hidden="true"></span> Signing in…
      </button>
    </form>
  </section>

  <!-- ERROR: INVALID_CREDENTIALS -->
  <section data-state-panel="error" hidden class="card card-pad" style="width: 100%; max-width: 400px;" aria-label="Sign in error">
    <div class="filter-tabs" role="tablist" style="display: flex; margin-bottom: var(--space-6);">
      <button class="filter-tab" role="tab" aria-selected="true" style="flex:1">Sign in</button>
      <button class="filter-tab" role="tab" aria-selected="false" style="flex:1">Create account</button>
    </div>
    <div class="banner banner-danger" role="alert" style="margin-bottom: var(--space-4);">
      <span class="banner-msg">Email or password is incorrect.</span>
    </div>
    <form style="display: flex; flex-direction: column; gap: var(--space-4);">
      <div class="field">
        <label class="field-label" for="email-error">Email</label>
        <input class="input" id="email-error" type="email" value="maya@example.com">
      </div>
      <div class="field">
        <label class="field-label" for="pw-error">Password</label>
        <input class="input" id="pw-error" type="password" value="wrong-guess">
      </div>
      <button class="btn btn-primary" type="button" style="width: 100%;">Sign in</button>
    </form>
  </section>

  <!-- PARTIAL: signup-mode VALIDATION_FAILED on one field -->
  <section data-state-panel="partial" hidden class="card card-pad" style="width: 100%; max-width: 400px;" aria-label="Create account with validation error">
    <div class="filter-tabs" role="tablist" style="display: flex; margin-bottom: var(--space-6);">
      <button class="filter-tab" role="tab" aria-selected="false" style="flex:1">Sign in</button>
      <button class="filter-tab" role="tab" aria-selected="true" style="flex:1">Create account</button>
    </div>
    <form style="display: flex; flex-direction: column; gap: var(--space-4);">
      <div class="field">
        <label class="field-label" for="email-partial">Email</label>
        <input class="input" id="email-partial" type="email" value="tomas@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label class="field-label" for="pw-partial">Password</label>
        <input class="input" id="pw-partial" type="password" value="short" aria-invalid="true" aria-describedby="pw-partial-err" autocomplete="new-password">
        <p class="field-error" id="pw-partial-err">Password must be at least 8 characters.</p>
      </div>
      <button class="btn btn-primary" type="button" style="width: 100%;">Create account</button>
    </form>
  </section>

  <p class="t-small text-muted" style="margin-top: var(--space-6); text-align: center; max-width: 400px;">
    Forgot your password? Reset isn’t available yet — contact support to recover access.
  </p>
</main>

<p id="status-live" class="sr-only" aria-live="polite"></p>

<div class="state-switcher no-print" role="group" aria-label="Mockup state switcher">
  <span class="sw-label t-micro">State</span>
  <button type="button" data-set-state="loading">Loading</button>
  <button type="button" data-set-state="empty">Empty</button>
  <button type="button" data-set-state="ideal">Ideal</button>
  <button type="button" data-set-state="error">Error</button>
  <button type="button" data-set-state="partial">Partial</button>
</div>

</body>
</html>
