<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="OMA — One Man Army: a full SDLC team of AI agents inside Claude Code">
  <title>OMA — One Man Army</title>
  <desc>A full SDLC team inside Claude Code: Discovery, Architecture, Design, Build, QA — gated by you.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C1117"/>
      <stop offset="55%" stop-color="#101820"/>
      <stop offset="100%" stop-color="#0A0E13"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="62%" stop-color="#F2E9E4"/>
      <stop offset="100%" stop-color="#D97757"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#3FA6A0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3FA6A0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="4" fill="#D97757" opacity="0.85"/>

  <!-- eyebrow -->
  <g transform="translate(640, 118)">
    <rect x="-152" y="-21" width="304" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.045" stroke="#D97757" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="-121" cy="0" r="4.5" fill="#3FA6A0"/>
    <text x="8" y="6" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2.6" fill="#C9D4DE">CLAUDE CODE PLUGIN</text>
  </g>

  <!-- wordmark -->
  <text x="640" y="286" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="164" font-weight="800" letter-spacing="-4" fill="url(#wordmark)">OMA</text>
  <text x="640" y="334" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="12" fill="#8FA3B4">ONE MAN ARMY</text>

  <rect x="440" y="366" width="400" height="2" fill="url(#rule)"/>

  <!-- promise -->
  <text x="640" y="416" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#E6EDF3">A full SDLC team of AI agents inside Claude Code.</text>
  <text x="640" y="454" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#8FA3B4">One idea in. A working, tested repository out — and you approve every phase.</text>

  <!-- pipeline strip -->
  <g transform="translate(0, 528)">
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" text-anchor="middle">
      <g transform="translate(212, 0)">
        <rect x="-92" y="-22" width="184" height="44" rx="10" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
        <text y="6" fill="#C9D4DE">DISCOVERY</text>
      </g>
      <text x="318" y="6" fill="#D97757" font-size="17">→</text>
      <g transform="translate(426, 0)">
        <rect x="-92" y="-22" width="184" height="44" rx="10" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
        <text y="6" fill="#C9D4DE">ARCHITECTURE</text>
      </g>
      <text x="532" y="6" fill="#D97757" font-size="17">→</text>
      <g transform="translate(640, 0)">
        <rect x="-92" y="-22" width="184" height="44" rx="10" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
        <text y="6" fill="#C9D4DE">DESIGN</text>
      </g>
      <text x="746" y="6" fill="#D97757" font-size="17">→</text>
      <g transform="translate(854, 0)">
        <rect x="-92" y="-22" width="184" height="44" rx="10" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
        <text y="6" fill="#C9D4DE">BUILD</text>
      </g>
      <text x="960" y="6" fill="#D97757" font-size="17">→</text>
      <g transform="translate(1068, 0)">
        <rect x="-92" y="-22" width="184" height="44" rx="10" fill="#3FA6A0" fill-opacity="0.10" stroke="#3FA6A0" stroke-opacity="0.35"/>
        <text y="6" fill="#8FD6D1">QA</text>
      </g>
    </g>
    <text x="640" y="66" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.6" fill="#5D7183">PM · ARCHITECT · UX · FRONTEND · BACKEND · QA · SECURITY · DEVOPS · SEO · MARKETING · SOCIAL</text>
  </g>
</svg>
