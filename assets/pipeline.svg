<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="The OMA phase pipeline: Discovery, Architecture, Design, Build, QA, DevOps, Growth and Ship, each ending in a human approval gate, with contracts frozen at the Architecture and Design gates and bounded repair loops from QA back to Build and from Security back to Build">
  <title>The OMA phase pipeline</title>
  <desc>Eight phases. Each dispatches role agents, writes durable artifacts to disk, and stops at a gate you approve. Contracts freeze at the gate of the phase that authored them. QA and Security file failures back to the build agents in bounded repair loops.</desc>

  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E141B"/>
      <stop offset="100%" stop-color="#0A0E13"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="460" rx="14" fill="url(#pbg)"/>

  <text x="40" y="50" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6EDF3">The pipeline</text>
  <text x="40" y="75" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#7D91A3">Every phase ends at a gate. Nothing advances without you.</text>

  <!-- track -->
  <line x1="60" y1="176" x2="1104" y2="176" stroke="#22303C" stroke-width="2"/>
  <line x1="60" y1="176" x2="1104" y2="176" stroke="#D97757" stroke-width="2" stroke-opacity="0.5"/>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">

    <!-- 01 Discovery -->
    <g transform="translate(104, 176)">
      <circle r="12" fill="#0E141B" stroke="#D97757" stroke-width="2.5"/>
      <circle r="4" fill="#D97757"/>
      <text y="-44" font-size="11.5" letter-spacing="1.3" fill="#5D7183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">01</text>
      <text y="-23" font-size="14.5" font-weight="650" fill="#E6EDF3">Discovery</text>
      <text y="44" font-size="12" fill="#8FA3B4">PM</text>
      <text y="64" font-size="11" fill="#5D7183">PRD · REQ ids</text>
      <text y="80" font-size="11" fill="#5D7183">scope</text>
    </g>

    <!-- 02 Architecture -->
    <g transform="translate(247, 176)">
      <circle r="12" fill="#0E141B" stroke="#D97757" stroke-width="2.5"/>
      <circle r="4" fill="#D97757"/>
      <text y="-44" font-size="11.5" letter-spacing="1.3" fill="#5D7183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">02</text>
      <text y="-23" font-size="14.5" font-weight="650" fill="#E6EDF3">Architecture</text>
      <text y="44" font-size="12" fill="#8FA3B4">Architect</text>
      <text y="64" font-size="11" fill="#5D7183">stack · model</text>
      <text y="80" font-size="11" fill="#5D7183">ADRs · api</text>
      <g transform="translate(-10, 106)">
        <rect x="-66" y="-13" width="132" height="25" rx="12.5" fill="#3FA6A0" fill-opacity="0.12" stroke="#3FA6A0" stroke-opacity="0.4"/>
        <text y="4.5" font-size="10.5" letter-spacing="0.4" fill="#8FD6D1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">FREEZE stack+model</text>
      </g>
    </g>

    <!-- 03 Design -->
    <g transform="translate(390, 176)">
      <circle r="12" fill="#0E141B" stroke="#D97757" stroke-width="2.5"/>
      <circle r="4" fill="#D97757"/>
      <text y="-44" font-size="11.5" letter-spacing="1.3" fill="#5D7183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">03</text>
      <text y="-23" font-size="14.5" font-weight="650" fill="#E6EDF3">Design</text>
      <text y="44" font-size="12" fill="#8FA3B4">UX Designer</text>
      <text y="64" font-size="11" fill="#5D7183">HTML mockups</text>
      <text y="80" font-size="11" fill="#5D7183">tokens · motion</text>
      <g transform="translate(12, 106)">
        <rect x="-78" y="-13" width="156" height="25" rx="12.5" fill="#3FA6A0" fill-opacity="0.12" stroke="#3FA6A0" stroke-opacity="0.4"/>
        <text y="4.5" font-size="10.5" letter-spacing="0.4" fill="#8FD6D1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">FREEZE api+tokens+motion</text>
      </g>
    </g>

    <!-- 04 Build -->
    <g transform="translate(533, 176)">
      <circle r="12" fill="#0E141B" stroke="#D97757" stroke-width="2.5"/>
      <circle r="4" fill="#D97757"/>
      <text y="-44" font-size="11.5" letter-spacing="1.3" fill="#5D7183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">04</text>
      <text y="-23" font-size="14.5" font-weight="650" fill="#E6EDF3">Build</text>
      <text y="44" font-size="12" fill="#8FA3B4">Frontend + Backend</text>
      <text y="64" font-size="11" fill="#5D7183">parallel, separate</text>
      <text y="80" font-size="11" fill="#5D7183">territory</text>
    </g>

    <!-- 05 QA -->
    <g transform="translate(676, 176)">
      <circle r="12" fill="#0E141B" stroke="#3FA6A0" stroke-width="2.5"/>
      <circle r="4" fill="#3FA6A0"/>
      <text y="-44" font-size="11.5" letter-spacing="1.3" fill="#5D7183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">05</text>
      <text y="-23" font-size="14.5" font-weight="650" fill="#E6EDF3">QA</text>
      <text y="44" font-size="12" fill="#8FA3B4">QA Engineer</text>
      <text y="64" font-size="11" fill="#5D7183">runs real commands</text>
      <text y="80" font-size="11" fill="#5D7183">files failures back</text>
    </g>

    <!-- 06 DevOps -->
    <g transform="translate(818, 176)">
      <circle r="12" fill="#0E141B" stroke="#3FA6A0" stroke-width="2.5"/>
      <circle r="4" fill="#3FA6A0"/>
      <text y="-44" font-size="11.5" letter-spacing="1.3" fill="#5D7183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">06</text>
      <text y="-23" font-size="14.5" font-weight="650" fill="#E6EDF3">DevOps</text>
      <text y="44" font-size="12" fill="#8FA3B4">Security → DevOps</text>
      <text y="64" font-size="11" fill="#5D7183">probes · CI · container</text>
      <text y="80" font-size="11" fill="#5D7183">deploy runbook</text>
    </g>

    <!-- 07 Growth -->
    <g transform="translate(961, 176)">
      <circle r="12" fill="#0E141B" stroke="#D97757" stroke-width="2.5"/>
      <circle r="4" fill="#D97757"/>
      <text y="-44" font-size="11.5" letter-spacing="1.3" fill="#5D7183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">07</text>
      <text y="-23" font-size="14.5" font-weight="650" fill="#E6EDF3">Growth</text>
      <text y="44" font-size="12" fill="#8FA3B4">SEO · Marketer · Social</text>
      <text y="64" font-size="11" fill="#5D7183">metadata in code</text>
      <text y="80" font-size="11" fill="#5D7183">copy · calendar</text>
    </g>

    <!-- 08 Ship -->
    <g transform="translate(1104, 176)">
      <circle r="12" fill="#0E141B" stroke="#D97757" stroke-width="2.5"/>
      <circle r="4" fill="#D97757"/>
      <text y="-44" font-size="11.5" letter-spacing="1.3" fill="#5D7183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">08</text>
      <text y="-23" font-size="14.5" font-weight="650" fill="#E6EDF3">Ship</text>
      <text y="44" font-size="12" fill="#8FA3B4">no agents</text>
      <text y="64" font-size="11" fill="#5D7183">final run</text>
      <text y="80" font-size="11" fill="#5D7183">ship report</text>
    </g>
  </g>

  <!-- repair loops: QA -> Build, Security -> Build -->
  <path d="M676 286 C 676 332, 620 342, 570 342 C 545 342, 533 330, 533 294" fill="none" stroke="#3FA6A0" stroke-width="1.7" stroke-dasharray="5 5" stroke-opacity="0.85"/>
  <path d="M526 298 L533 282 L540 298 Z" fill="#3FA6A0"/>
  <path d="M818 300 C 818 376, 700 390, 620 390 C 578 390, 566 372, 566 306" fill="none" stroke="#E0B341" stroke-width="1.7" stroke-dasharray="5 5" stroke-opacity="0.7"/>
  <path d="M559 310 L566 294 L573 310 Z" fill="#E0B341"/>

  <text x="612" y="360" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6E8797">QA repair loop · bounded at 3</text>
  <text x="672" y="408" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8A7A47">security harden loop · bounded at 2</text>

  <!-- legend -->
  <g transform="translate(40, 428)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5">
    <circle cx="7" cy="-4" r="6" fill="#0E141B" stroke="#D97757" stroke-width="2"/>
    <text x="24" y="0" fill="#7D91A3">= human approval gate — you run /oma:gate approve or reject</text>
    <rect x="470" y="-13" width="13" height="13" rx="4" fill="#3FA6A0" fill-opacity="0.15" stroke="#3FA6A0" stroke-opacity="0.45"/>
    <text x="494" y="0" fill="#7D91A3">= contract frozen — a hook physically blocks edits from here on</text>
  </g>
</svg>
